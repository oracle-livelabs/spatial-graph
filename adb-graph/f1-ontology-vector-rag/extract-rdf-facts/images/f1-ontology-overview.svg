<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title description">
  <title id="title">F1 ontology overview</title>
  <desc id="description">The prompt supplies this AI-assisted, human-reviewed F1 ontology, which shows class groups, permitted relationships, and a minimum-weight measurement pattern.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#718096"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243247; }
      .panel { fill: #ffffff; stroke: #dbe3ed; stroke-width: 1.5; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .class-box { fill: #edf4ff; stroke: #9bb8e0; stroke-width: 1.5; }
      .class-title { font-size: 17px; font-weight: 700; }
      .subclass-box { fill: #f7faff; stroke: #c5d5ea; stroke-width: 1.2; }
      .subclass-text { font-size: 15px; font-weight: 600; }
      .relation-box { fill: #eef8f5; stroke: #acd2c6; stroke-width: 1.2; }
      .relation-text { font-size: 14px; font-weight: 700; fill: #286b59; }
      .node-text { font-size: 13px; font-weight: 600; }
      .muted { font-size: 14px; fill: #64748b; }
      .small { font-size: 13px; fill: #64748b; }
      .arrow-line { stroke: #718096; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="980" fill="#f4f7fb"/>
  <text x="40" y="58" font-size="32" font-weight="750">F1 ontology, at a glance</text>
  <text x="40" y="91" font-size="16" fill="#526176">The prompt supplies it; AI helped draft it, and human review refined it.</text>
  <rect x="1121" y="42" width="279" height="36" rx="18" fill="#e8eef7"/>
  <text x="1260" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#526176">PROMPT GUIDE · PREFIX f1:</text>

  <!-- Class groups -->
  <rect class="panel" x="36" y="126" width="430" height="820" rx="18"/>
  <text class="panel-title" x="60" y="166">Classes and types</text>
  <text class="small" x="60" y="188">Related concepts share a class hierarchy.</text>

  <rect class="class-box" x="60" y="207" width="382" height="46" rx="10"/>
  <text class="class-title" x="251" y="236" text-anchor="middle">Car</text>
  <rect class="class-box" x="60" y="263" width="382" height="46" rx="10"/>
  <text class="class-title" x="251" y="292" text-anchor="middle">Unit</text>

  <rect class="class-box" x="60" y="325" width="382" height="48" rx="10"/>
  <text class="class-title" x="251" y="355" text-anchor="middle">VehicleFeature</text>
  <text class="label" x="60" y="400">SUBCLASSES</text>
  <rect class="subclass-box" x="60" y="412" width="184" height="40" rx="9"/>
  <text class="subclass-text" x="152" y="437" text-anchor="middle">EnergyMode</text>
  <rect class="subclass-box" x="258" y="412" width="184" height="40" rx="9"/>
  <text class="subclass-text" x="350" y="437" text-anchor="middle">AeroMode</text>
  <rect class="subclass-box" x="60" y="460" width="184" height="40" rx="9"/>
  <text class="subclass-text" x="152" y="485" text-anchor="middle">Component</text>
  <rect class="subclass-box" x="258" y="460" width="184" height="40" rx="9"/>
  <text class="subclass-text" x="350" y="485" text-anchor="middle">System</text>
  <rect class="subclass-box" x="60" y="508" width="382" height="40" rx="9"/>
  <text class="subclass-text" x="251" y="533" text-anchor="middle">LegacySystem</text>

  <rect class="class-box" x="60" y="563" width="382" height="64" rx="10"/>
  <text class="class-title" x="80" y="589">Tyre</text>
  <text class="muted" x="80" y="612">FrontTyre · RearTyre</text>

  <rect class="class-box" x="60" y="642" width="382" height="82" rx="10"/>
  <text class="class-title" x="80" y="670">Measurement</text>
  <text class="muted" x="80" y="698">Length · Width · Weight · Energy · Power</text>

  <rect class="class-box" x="60" y="739" width="382" height="80" rx="10"/>
  <text class="class-title" x="80" y="768">MeasurementKind</text>
  <text class="muted" x="80" y="794">Minimum · Maximum · Reduction</text>

  <rect x="60" y="834" width="382" height="87" rx="10" fill="#f8fafc" stroke="#e1e8f0"/>
  <text class="label" x="78" y="858">REUSED EXAMPLE IDS</text>
  <text class="small" x="78" y="881">ActiveAero, PowerUnit, HybridSystem : System</text>
  <text class="small" x="78" y="902">DRS : LegacySystem</text>

  <!-- Allowed relationships -->
  <rect class="panel" x="482" y="126" width="540" height="820" rx="18"/>
  <text class="panel-title" x="506" y="166">Allowed relationships</text>
  <text class="small" x="506" y="188">Arrows show the direction of each relationship.</text>

  <g>
    <rect x="506" y="212" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="224" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="246" text-anchor="middle">Car2026</text>
    <line class="arrow-line" x1="637" y1="241" x2="658" y2="241"/>
    <rect class="relation-box" x="664" y="223" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="246" text-anchor="middle">usesFeature</text>
    <line class="arrow-line" x1="829" y1="241" x2="850" y2="241"/>
    <rect class="subclass-box" x="856" y="224" width="130" height="34" rx="8"/>
    <text class="node-text" x="921" y="246" text-anchor="middle">Component / System</text>
  </g>
  <g>
    <rect x="506" y="278" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="290" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="312" text-anchor="middle">Car2026</text>
    <line class="arrow-line" x1="637" y1="307" x2="658" y2="307"/>
    <rect class="relation-box" x="664" y="289" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="312" text-anchor="middle">usesEnergyMode</text>
    <line class="arrow-line" x1="829" y1="307" x2="850" y2="307"/>
    <rect class="subclass-box" x="856" y="290" width="130" height="34" rx="8"/>
    <text class="node-text" x="921" y="312" text-anchor="middle">EnergyMode</text>
  </g>
  <g>
    <rect x="506" y="344" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="356" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="378" text-anchor="middle">Car2026</text>
    <line class="arrow-line" x1="637" y1="373" x2="658" y2="373"/>
    <rect class="relation-box" x="664" y="355" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="378" text-anchor="middle">usesAeroMode</text>
    <line class="arrow-line" x1="829" y1="373" x2="850" y2="373"/>
    <rect class="subclass-box" x="856" y="356" width="130" height="34" rx="8"/>
    <text class="node-text" x="921" y="378" text-anchor="middle">AeroMode</text>
  </g>
  <g>
    <rect x="506" y="410" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="422" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="444" text-anchor="middle">New system</text>
    <line class="arrow-line" x1="637" y1="439" x2="658" y2="439"/>
    <rect class="relation-box" x="664" y="421" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="444" text-anchor="middle">replacesSystem</text>
    <line class="arrow-line" x1="829" y1="439" x2="850" y2="439"/>
    <rect class="subclass-box" x="856" y="422" width="130" height="34" rx="8"/>
    <text class="node-text" x="921" y="444" text-anchor="middle">DRS (LegacySystem)</text>
  </g>
  <g>
    <rect x="506" y="476" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="488" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="510" text-anchor="middle">Mode / technique</text>
    <line class="arrow-line" x1="637" y1="505" x2="658" y2="505"/>
    <rect class="relation-box" x="664" y="487" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="510" text-anchor="middle">disables</text>
    <line class="arrow-line" x1="829" y1="505" x2="850" y2="505"/>
    <rect class="subclass-box" x="856" y="488" width="130" height="34" rx="8"/>
    <text class="node-text" x="921" y="510" text-anchor="middle">Feature</text>
  </g>
  <g>
    <rect x="506" y="542" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="554" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="576" text-anchor="middle">Car2026</text>
    <line class="arrow-line" x1="637" y1="571" x2="658" y2="571"/>
    <rect class="relation-box" x="664" y="553" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="576" text-anchor="middle">hasMeasurement</text>
    <line class="arrow-line" x1="829" y1="571" x2="850" y2="571"/>
    <rect class="subclass-box" x="856" y="554" width="130" height="34" rx="8"/>
    <text class="node-text" x="921" y="576" text-anchor="middle">Measurement</text>
  </g>
  <g>
    <rect x="506" y="608" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="620" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="642" text-anchor="middle">Measurement</text>
    <line class="arrow-line" x1="637" y1="637" x2="658" y2="637"/>
    <rect class="relation-box" x="664" y="619" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="642" text-anchor="middle">hasUnit</text>
    <line class="arrow-line" x1="829" y1="637" x2="850" y2="637"/>
    <rect class="subclass-box" x="856" y="620" width="130" height="34" rx="8"/>
    <text class="node-text" x="921" y="642" text-anchor="middle">Unit</text>
  </g>
  <g>
    <rect x="506" y="674" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="686" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="708" text-anchor="middle">Measurement</text>
    <line class="arrow-line" x1="637" y1="703" x2="658" y2="703"/>
    <rect class="relation-box" x="664" y="685" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="708" text-anchor="middle">measurementKind</text>
    <line class="arrow-line" x1="829" y1="703" x2="850" y2="703"/>
    <rect class="subclass-box" x="856" y="686" width="130" height="34" rx="8"/>
    <text class="node-text" x="921" y="708" text-anchor="middle">MeasurementKind</text>
  </g>
  <g>
    <rect x="506" y="740" width="492" height="58" rx="10" fill="#f8fafc"/>
    <rect class="subclass-box" x="518" y="752" width="116" height="34" rx="8"/>
    <text class="node-text" x="576" y="774" text-anchor="middle">Measurement</text>
    <line class="arrow-line" x1="637" y1="769" x2="658" y2="769"/>
    <rect class="relation-box" x="664" y="751" width="162" height="36" rx="18"/>
    <text class="relation-text" x="745" y="774" text-anchor="middle">hasValue</text>
    <line class="arrow-line" x1="829" y1="769" x2="850" y2="769"/>
    <rect x="856" y="752" width="130" height="34" rx="8" fill="#fff7e8" stroke="#e4ca8b" stroke-width="1.2"/>
    <text class="node-text" x="921" y="774" text-anchor="middle">Decimal value</text>
  </g>
  <rect x="506" y="822" width="492" height="78" rx="12" fill="#f0f6ff" stroke="#d6e4f5"/>
  <text x="526" y="850" font-size="14" font-weight="700">Class membership uses rdf:type.</text>
  <text class="small" x="526" y="875">usesEnergyMode and usesAeroMode refine usesFeature.</text>

  <!-- Measurement example -->
  <rect class="panel" x="1038" y="126" width="366" height="820" rx="18"/>
  <text class="panel-title" x="1062" y="166">Measurement example</text>
  <text class="small" x="1062" y="188">A number belongs to its own node.</text>

  <rect class="subclass-box" x="1062" y="216" width="318" height="48" rx="10"/>
  <text class="class-title" x="1221" y="246" text-anchor="middle">Car2026</text>
  <line class="arrow-line" x1="1221" y1="266" x2="1221" y2="304"/>
  <rect class="relation-box" x="1139" y="274" width="164" height="30" rx="15"/>
  <text class="relation-text" x="1221" y="294" text-anchor="middle">hasMeasurement</text>

  <rect class="class-box" x="1062" y="313" width="318" height="80" rx="12"/>
  <text x="1221" y="345" text-anchor="middle" font-size="16" font-weight="700">Car2026_MinimumWeight</text>
  <text class="muted" x="1221" y="372" text-anchor="middle">rdf:type WeightMeasurement</text>

  <text class="label" x="1062" y="430">MEASUREMENT DETAILS</text>
  <rect x="1062" y="444" width="318" height="58" rx="10" fill="#f8fafc" stroke="#e1e8f0"/>
  <text class="relation-text" x="1080" y="479">hasValue</text>
  <text x="1362" y="479" text-anchor="end" font-size="14" font-weight="700">768 xsd:decimal</text>
  <rect x="1062" y="512" width="318" height="58" rx="10" fill="#f8fafc" stroke="#e1e8f0"/>
  <text class="relation-text" x="1080" y="547">hasUnit</text>
  <text x="1362" y="547" text-anchor="end" font-size="14" font-weight="700">Kilogram</text>
  <rect x="1062" y="580" width="318" height="58" rx="10" fill="#f8fafc" stroke="#e1e8f0"/>
  <text class="relation-text" x="1080" y="615">measurementKind</text>
  <text x="1362" y="615" text-anchor="end" font-size="14" font-weight="700">Minimum</text>

  <rect x="1062" y="671" width="318" height="126" rx="12" fill="#fff7e8" stroke="#e8d5a8"/>
  <text x="1082" y="704" font-size="14" font-weight="700">Why keep a separate node?</text>
  <text class="muted" x="1082" y="732">The value, unit, and kind stay together</text>
  <text class="muted" x="1082" y="754">on the measurement. The car links to</text>
  <text class="muted" x="1082" y="776">that node with hasMeasurement.</text>

  <text class="small" x="1062" y="861">Examples reuse fixed IDs such as</text>
  <text class="small" x="1062" y="884">f1:Kilogram and f1:Minimum.</text>
</svg>
